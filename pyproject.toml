[project]
name = "iros-agent"
version = "0.1.0"
description = "Eye-LLM: Spatial Intent Prediction System for IROS 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 现有依赖
    "langchain>=1.2.3",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.5",
    "networkx>=3.6.1",
    "openai>=2.15.0",
    "pandas>=2.0.0,<3.0.0",

    # LLM相关
    "python-dotenv>=1.0.0",

    # SAM 2 API（云端）
    "replicate>=0.31.0",

    # 可视化
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.31.0",

    # 图像处理
    "pillow>=10.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.0.0",
    "opencv-python>=4.9.0",

    # 科学计算
    "numpy>=1.24.0",
    "scipy>=1.11.0",

    # 数据处理
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",

    # 测试
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
